<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquitectura Global Real - Vadom Data</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --lean-navy: #00204a;
            --lean-blue: #0056b3;
            --lean-red: #d63031;
            --bg-light: #f8fafc;
            --line-color: #cbd5e0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .diagram-container {
            text-align: center;
            position: relative;
            padding: 20px;
            width: 1200px; /* Más ancho para que quepan las 5 filiales */
            max-width: 95%;
        }

        /* === NIVEL SUPERIOR: FILIALES (5 Columnas) === */
        .filiales-wrapper {
            display: flex;
            justify-content: space-between; /* Distribuye las 5 tarjetas */
            gap: 15px;
            margin-bottom: 100px;
            position: relative;
            z-index: 2;
        }

        .card-filial {
            background: white;
            border-radius: 12px;
            padding: 20px 10px;
            width: 18%; /* Ancho dinámico para que quepan 5 */
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 4px solid var(--lean-blue);
            transition: transform 0.3s ease;
            position: relative;
            min-width: 140px;
        }

        .card-filial:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 32, 74, 0.15);
            z-index: 10;
        }

        .flag-icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
            display: block;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.1));
        }

        .filial-title {
            font-weight: 800;
            color: var(--lean-navy);
            font-size: 0.95rem;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .filial-desc {
            font-size: 0.75rem;
            color: #64748b;
            line-height: 1.3;
        }

        /* Etiquetas */
        .badge-local {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: #f1f5f9;
            color: #475569;
            font-size: 0.6rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin-top: 8px;
            font-weight: 600;
            width: 90%;
        }

        /* === NIVEL INFERIOR: HQ COLOMBIA === */
        .hq-container {
            position: relative;
            display: inline-block;
            z-index: 2;
            margin-top: -20px;
        }

        .card-hq {
            background: linear-gradient(145deg, #00204a, #001533);
            color: white;
            border-radius: 20px;
            padding: 35px 50px;
            box-shadow: 0 20px 60px rgba(0, 32, 74, 0.4);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            min-width: 320px;
        }

        .hq-icon {
            font-size: 3rem;
            color: #38bdf8;
            margin-bottom: 10px;
            animation: pulse-glow 3s infinite;
        }

        .hq-title {
            font-size: 1.3rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: 1px;
        }

        .hq-country {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* === CONECTORES SVG === */
        .connectors-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: visible;
        }

        .connector-line {
            stroke: var(--line-color);
            stroke-width: 2;
            fill: none;
        }

        .data-packet {
            fill: var(--lean-blue);
        }

        /* Animaciones */
        @keyframes pulse-glow {
            0% { text-shadow: 0 0 10px rgba(56, 189, 248, 0.2); transform: scale(1); }
            50% { text-shadow: 0 0 30px rgba(56, 189, 248, 0.6); transform: scale(1.05); }
            100% { text-shadow: 0 0 10px rgba(56, 189, 248, 0.2); transform: scale(1); }
        }

        .title-header {
            position: absolute;
            top: -40px;
            width: 100%;
            text-align: center;
            color: #94a3b8;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

    </style>
</head>
<body>

    <div class="diagram-container">
        <div class="title-header">Ecosistema Global Centralizado</div>

        <svg class="connectors-svg" viewBox="0 0 1200 500" preserveAspectRatio="none">
            <defs>
                <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#cbd5e0" />
                </marker>
            </defs>

            <path id="pathGT" d="M120,160 C120,300 600,200 600,320" class="connector-line" marker-end="url(#arrow)"/>
            
            <path id="pathPH" d="M360,160 C360,280 600,220 600,320" class="connector-line" marker-end="url(#arrow)"/>
            
            <path id="pathUS" d="M600,160 L600,320" class="connector-line" marker-end="url(#arrow)"/>
            
            <path id="pathEC" d="M840,160 C840,280 600,220 600,320" class="connector-line" marker-end="url(#arrow)"/>
            
            <path id="pathMX" d="M1080,160 C1080,300 600,200 600,320" class="connector-line" marker-end="url(#arrow)"/>

            <circle r="5" class="data-packet">
                <animateMotion href="#pathGT" dur="2.5s" repeatCount="indefinite" begin="0s"/>
            </circle>
            <circle r="5" class="data-packet">
                <animateMotion href="#pathPH" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
            </circle>
            <circle r="5" class="data-packet">
                <animateMotion href="#pathUS" dur="2.5s" repeatCount="indefinite" begin="1s"/>
            </circle>
            <circle r="5" class="data-packet">
                <animateMotion href="#pathEC" dur="2.5s" repeatCount="indefinite" begin="1.5s"/>
            </circle>
            <circle r="5" class="data-packet">
                <animateMotion href="#pathMX" dur="2.5s" repeatCount="indefinite" begin="2s"/>
            </circle>
        </svg>

        <div class="filiales-wrapper">
            <div class="card-filial">
                <span class="flag-icon">🇬🇹</span>
                <div class="filial-title">Guatemala</div>
                <div class="badge-local"><i class="fas fa-file-invoice"></i> Forms GT</div>
            </div>

            <div class="card-filial">
                <span class="flag-icon">🇵🇭</span>
                <div class="filial-title">Filipinas</div>
                <div class="badge-local"><i class="fas fa-language"></i> English / Tag</div>
            </div>

            <div class="card-filial">
                <span class="flag-icon">🇺🇸</span>
                <div class="filial-title">Estados Unidos</div>
                <div class="badge-local"><i class="fas fa-university"></i> OFAC Rules</div>
            </div>

            <div class="card-filial">
                <span class="flag-icon">🇪🇨</span>
                <div class="filial-title">Ecuador</div>
                <div class="badge-local"><i class="fas fa-gavel"></i> UAFE Local</div>
            </div>

            <div class="card-filial">
                <span class="flag-icon">🇲🇽</span>
                <div class="filial-title">México</div>
                <div class="badge-local"><i class="fas fa-file-contract"></i> SAT Check</div>
            </div>
        </div>

        <div class="hq-container">
            <div class="card-hq">
                <div class="hq-country">
                    <span style="font-size:1.5rem">🇨🇴</span> Casa Matriz
                </div>
                <div class="hq-icon"><i class="fas fa-server"></i></div>
                <div class="hq-title">COLOMBIA</div>
                <p style="margin:5px 0 15px 0; font-size:0.8rem; opacity:0.7;">Repositorio Central Unificado</p>
                
                <div style="display:flex; justify-content:center; gap:10px;">
                    <div style="background:rgba(255,255,255,0.1); padding:5px 15px; border-radius:20px; font-size:0.7rem;">
                        <i class="fas fa-globe-americas"></i> Global Dashboard
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
