{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% load static %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg border-0" style="width: 100%; max-width: 400px; border-radius: 12px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <img src="{% static 'images/asnc_logo_full.png' %}" alt="ASNC" class="mb-3" style="max-height: 70px;">
                <h4 class="fw-bold text-secondary">Portal del Asociado</h4>
                <p class="text-muted small">Ingresa con tu correo y contrasena.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-asnc-primary">Ingresar</button>
                </div>
            </form>
        </div>
        <div class="card-footer bg-light text-center py-3 border-0 rounded-bottom-3">
            <small class="text-muted"><a href="/" class="text-decoration-none">Volver al sitio web</a></small>
        </div>
    </div>
</div>
{% endblock %}
