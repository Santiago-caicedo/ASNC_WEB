{% extends 'members/base_members.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="kpi-card text-center py-5">
            <div class="rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4"
                 style="width: 80px; height: 80px; background-color: rgba(40, 167, 69, 0.1);">
                <i class="bi bi-check-circle-fill fs-1 text-success"></i>
            </div>

            <h3 class="fw-bold mb-3">Contrasena Actualizada</h3>
            <p class="text-muted mb-4">
                Tu contrasena ha sido cambiada exitosamente.
                <br>Usa tu nueva contrasena la proxima vez que inicies sesion.
            </p>

            <div class="d-flex justify-content-center gap-2">
                <a href="{% url 'members:dashboard' %}" class="btn btn-asnc-gold">
                    <i class="bi bi-house me-1"></i> Ir al Inicio
                </a>
                <a href="{% url 'members:profile' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-person me-1"></i> Ver Perfil
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
