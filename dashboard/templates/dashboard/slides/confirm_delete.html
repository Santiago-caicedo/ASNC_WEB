{% extends 'dashboard/base_dashboard.html' %}

{% block content %}
<div class="mb-4">
    <a href="{% url 'slide_list' %}" class="text-decoration-none text-muted small fw-bold">
        <i class="bi bi-arrow-left me-1"></i> Volver al listado
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-header bg-danger text-white p-4 text-center">
                <i class="bi bi-exclamation-triangle-fill display-4"></i>
                <h5 class="fw-bold mb-0 mt-3">Eliminar slide</h5>
            </div>
            <div class="card-body p-4 text-center">
                <img src="{{ object.main_image.url }}" alt="" class="rounded-3 mb-3" style="max-width: 220px; max-height: 140px; object-fit: contain;">

                <h5 class="fw-bold text-dark">{{ object.title }}</h5>

                <div class="alert alert-warning border-0 rounded-3 mt-3">
                    <i class="bi bi-info-circle me-2"></i>
                    Esta acción no se puede deshacer. Si solo quieres retirarlo de la portada, edítalo y desmarca "Visible".
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <a href="{% url 'slide_list' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
                        <button type="submit" class="btn btn-danger rounded-pill px-4">
                            <i class="bi bi-trash me-2"></i>Sí, eliminar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
